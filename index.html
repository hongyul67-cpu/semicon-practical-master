<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;

.wrap{max-width:760px;margin:0 auto;padding:0 13px 120px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(12,16,23,.93);

.topin{max-width:760px;margin:0 auto;padding:9px 13px;display:flex;align-items:center;gap:9px}
.brand{font-weight:900;font-size:15px;letter-spacing:-.3px}
.brand small{display:block;font-weight:600;font-size:11px;color:var(--dim2);letter-spacing:0}
.tbtn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.tbtn:hover{border-color:var(--si)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 15px;margin:13px 0;box-shadow:var(--sh)}
h1{font-size:22px;font-weight:900;margin:16px 0 4px;letter-spacing:-.5px}
h1 span{color:var(--si)}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:4px}
.pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--si)}
.big{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);

.big:hover{border-color:var(--si);transform:translateY(-1px)}
.big b{display:block;font-size:16px;font-weight:800;margin-bottom:2px}
.big i{font-style:normal;color:var(--dim);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{background:linear-gradient(180deg,var(--si2),#2a7fd6);border:0;color:#04121f;
  border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:900;cursor:pointer}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.42;filter:grayscale(.6);cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(12,16,23,.95);

.footin{max-width:760px;margin:0 auto;padding:10px 13px;display:flex;gap:9px}
.footin .btn{flex:1}
.hi{color:var(--si)}
ul{margin:8px 0;padding-left:19px}li{margin:5px 0}
.tipbox{margin-top:11px;background:#101a26;border:1px solid var(--line);border-left:3px solid var(--gold);

.warnbox{margin-top:11px;background:#20131a;border:1px solid #4a2733;border-left:3px solid var(--bad);

.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);

.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 2px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--line)}
.dot.on{background:var(--si)}
.score{font-size:13px;color:var(--dim);text-align:right}

.cyl{display:flex;align-items:center;gap:9px;margin:11px 0}
.cyl .nm{width:58px;font-size:12.5px;font-weight:800;color:var(--dim)}
.track{position:relative;flex:1;height:26px;background:#0a1119;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.rod{position:absolute;top:5px;left:4px;height:14px;width:22px;background:linear-gradient(180deg,#dbe7f7,#93a6c2);
  border-radius:4px;transition:transform .55s cubic-bezier(.4,.1,.3,1)}
.track.ext .rod{transform:translateX(calc(100% * 0 + var(--go,150px)))}
.lamps{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}
.lamp{width:40px;height:40px;border-radius:99px;border:2px solid var(--line);background:#0a1119;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--dim2);transition:.15s}
.lamp.on.G{background:#3ad995;border-color:#7dffc4;color:#04231a;box-shadow:0 0 18px #3ad99588}
.lamp.on.Y{background:#ffd166;border-color:#ffe6a8;color:#241c00;box-shadow:0 0 18px #ffd16688}
.lamp.on.R{background:#ff5f6d;border-color:#ffb0b6;color:#2a0409;box-shadow:0 0 18px #ff5f6d88}
.steplog{font-size:12.5px;color:var(--dim);min-height:20px;text-align:center;margin-top:8px}

.slot{min-height:44px;border:1.5px dashed var(--line);border-radius:11px;padding:7px 9px;margin:6px 0;

.slot.filled{border-style:solid;background:var(--panel2);color:var(--ink)}
.slot.ok{border-color:var(--good);background:rgba(58,217,149,.12)}
.slot.no{border-color:var(--bad);background:rgba(255,95,109,.12)}
.slot .no-{color:var(--si);font-weight:800;min-width:18px}
.bar{height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--si2),var(--air));width:0;transition:width .3s}
.muted{color:var(--dim2);font-size:12px}
.rowbtn{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.rowbtn .btn{flex:1;min-width:120px;padding:10px 12px;font-size:13.5px}
</style>

let ag=null;
function startAsmGame(){
  const qs=shuffle(ASM).map(d=>{
    const view=Math.random()<.5?'f':'s';
    const arr=d[view], kind=['max','sum','count','nth'][Math.random()*4|0];
    const vname=view==='f'?'정면도':'측면도';
    let q,ans;
    if(kind==='max'){ q=`도면 ${d.n}의 2D ${vname}에서 <b>가장 큰 치수</b>는?`; ans=Math.max(...arr); }
    else if(kind==='sum'){ q=`도면 ${d.n}의 2D ${vname}에 표시된 <b>치수를 모두 더하면</b>?`; ans=arr.reduce((a,b)=>a+b,0); }
    else if(kind==='count'){ q=`도면 ${d.n}의 2D ${vname}에 표시된 <b>치수의 개수</b>는?`; ans=arr.length; }
    else { const k=Math.random()*arr.length|0; q=`도면 ${d.n}의 2D ${vname}에서 <b>${k+1}번째 치수</b>는? <span class="muted">(밸브 쪽에서 (A) 쪽으로 읽는 순서)</span>`; ans=arr[k]; }
    const opts=new Set([ans]);
    while(opts.size<4){ const v = kind==='count' ? ans+((Math.random()*4|0)-2) : ans+([-50,-30,-20,-10,10,20,30,50][Math.random()*8|0]); if(v>0)opts.add(v); }
    return {img:`img/asm-${String(d.n).padStart(2,'0')}.png`, q, o:shuffle([...opts]), a:ans, unit:kind==='count'?'개':'mm'};
  });
  ag={qs,i:0,ok:0,wrong:[]}; renderAsmGame();
}
function renderAsmGame(){
  if(ag.i>=ag.qs.length) return gameResult('🎯 도면 치수 읽기', ag.ok, ag.qs.length, ag.wrong, startAsmGame);
  const it=ag.qs[ag.i];
  $('sc').innerHTML=`
  <div class="card">
    <div style="display:flex"><div class="pill">🎯 도면 치수 ${ag.i+1} / ${ag.qs.length}</div>
      <div class="score" style="flex:1">맞은 개수 ${ag.ok}</div></div>
    <div class="fig" style="margin-top:11px"><img src="${it.img}" alt="도면"></div>
    <div class="qtext" style="margin-top:12px">${it.q}</div>
    <div id="opts">${it.o.map((v,i)=>`<button class="opt" data-i="${i}">${v} ${it.unit}</button>`).join('')}</div>
    <div id="exp"></div>
  </div>`;
  foot('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const v=it.o[+b.dataset.i], ok=v===it.a;
    $('opts').querySelectorAll('.opt').forEach((x,i)=>{x.onclick=null;
      if(it.o[i]===it.a)x.classList.add('ok'); else if(i===+b.dataset.i)x.classList.add('no'); else x.classList.add('dim');});
    if(ok){ag.ok++;fxOK();}else{ag.wrong.push(it.q.replace(/<[^>]+>/g,'')+` → 정답 ${it.a}${it.unit}`);fxNO();}
    $('exp').innerHTML=`<div class="exp"><b>${ok?'정답':'정답은 '+it.a+it.unit}</b> · 도면 위 치수를 직접 짚어 보며 확인하세요.</div>`;

let sim={i:0,timer:null,step:-1,blink:null};
function openSim(i){ stopSim(); sim.i=i; sim.step=-1; renderSim(); }
function stopSim(){ if(sim.timer){clearTimeout(sim.timer);sim.timer=null;} if(sim.blink){clearInterval(sim.blink);sim.blink=null;} }
function renderSim(){
  const c=CTL[sim.i], sp=CTL_STEPS[c.n];
  $('sc').innerHTML=`

  <div class="chips">${CTL.map((x,i)=>`<div class="chip ${i===sim.i?'on':''}" onclick="openSim(${i})">${x.n}</div>`).join('')}</div>
  <div class="card">
    <div class="pill">동작</div>
    <p style="margin:8px 0 2px"><b class="hi">${c.act}</b></p>
    <p class="muted" style="margin:0">${c.rule}</p>
    <div class="simwrap">
      <div class="lamps">
        <div class="lamp G" id="lG">녹</div><div class="lamp Y" id="lY">황</div><div class="lamp R" id="lR">적</div>
      </div>
      ${[1,2,3].map(n=>`<div class="cyl"><div class="nm">실린더${n}</div>
        <div class="track" id="tk${n}"><div class="rod" id="rd${n}"></div></div></div>`).join('')}
      <div class="steplog" id="slog">▶ 시작을 누르세요</div>
    </div>
    <div class="rowbtn">
      <button class="btn" id="simGo">▶ 스위치 1 (테스트 동작)</button>
      <button class="btn ghost" id="simRst">↺ 초기화</button>
    </div>
    <div class="tipbox">💡 로드가 <b>움직이는 동안</b>이 “전진 중 / 후진 중”, <b>끝에서 멈춘 상태</b>가 “전진완료 / 후진완료”입니다.
      램프 조건이 어느 쪽인지 표에서 꼭 확인하세요.</div>
  </div>`;
  foot(`<button class="btn ghost" onclick="openCtl(${sim.i})">📄 과제 전문 보기</button>
        <button class="btn ghost" onclick="goHome()">🏠 홈으로</button>`);
  resetSim();
  $('simGo').onclick=runSim; $('simRst').onclick=()=>{stopSim();resetSim();$('slog').textContent='▶ 시작을 누르세요';};
}
function resetSim(){
  const c=CTL[sim.i], sp=CTL_STEPS[c.n];
  // 첫 동작이 후진인 실린더는 전진상태에서 시작
  const startExt=new Set();
  const seen=new Set();
  sp.steps.forEach(s=>s.c.forEach(n=>{ if(!seen.has(n)){seen.add(n); if(s.d==='ret')startExt.add(n);} }));
  [1,2,3].forEach(n=>setRod(n, startExt.has(n)));
  ['G','Y','R'].forEach(L=>$('l'+L).classList.remove('on'));
}
function setRod(n,ext){
  const tk=$('tk'+n); if(!tk)return;
  const w=tk.clientWidth-32;
  $('rd'+n).style.transform = ext?`translateX(${w}px)`:'translateX(0)';
  tk.dataset.ext = ext?'1':'0';
}
function lampFor(sp, moving){ // moving = {c:[..], d:'ext'|'ret'}
  const on=new Set();
  if(!moving) return on;
  sp.lamps.forEach(r=>{
    const hit = r.c.some(n=>moving.c.includes(n));
    if(!hit) return;
    if(r.p==='any' || r.p===moving.d) on.add(r.L);
  });
  return on;
}
function runSim(){
  stopSim(); resetSim();
  const c=CTL[sim.i], sp=CTL_STEPS[c.n];
  let k=0;
  const go=()=>{
    if(k>=sp.steps.length){
      ['G','Y','R'].forEach(L=>$('l'+L).classList.remove('on'));
      $('slog').innerHTML='✅ 테스트 동작 완료';
      if(window.FX)FX.burst&&FX.burst({type:'ok'});
      return;
    }
    const s=sp.steps[k];
    const on=lampFor(sp,s);
    ['G','Y','R'].forEach(L=>$('l'+L).classList.toggle('on',on.has(L)));
    s.c.forEach(n=>setRod(n, s.d==='ext'));
    const names={G:'녹색',Y:'황색',R:'적색'};
    $('slog').innerHTML=`${k+1}단계 · 실린더${s.c.join('·')} <b class="hi">${s.d==='ext'?'전진':'후진'} 중</b>`
      +(on.size?` · ${[...on].map(L=>names[L]).join('·')}램프 점등`:'');
    k++; sim.timer=setTimeout(go,900);
  };
  go();
}

let og=null;
function startOrder(){
  const set=CTL[Math.random()*CTL.length|0], sp=CTL_STEPS[set.n];
  const items=sp.steps.map((s,i)=>({i,label:`실린더${s.c.join('·')} ${s.d==='ext'?'전진':'후진'}`}));
  og={set,items,pool:shuffle(items),picked:[],first:new Set(),done:false};
  renderOrder();
}
function renderOrder(){
  const {set,items,pool,picked}=og;
  $('sc').innerHTML=`

    <div class="qtext" style="margin-top:11px">스위치 1을 눌렀을 때 <b class="hi">${set.cyl}</b>는 어떤 순서로 움직입니까?</div>

    <div id="slots">${items.map((_,i)=>{
      const p=picked[i];
      return `<div class="slot ${p?'filled':''} ${p?(p.i===i?'ok':'no'):''}">

      ${pool.map((p,i)=>`<div class="chip" data-i="${i}">${p.label}</div>`).join('')}
    </div>
    <div id="oexp"></div>
  </div>`;
  foot(og.done?`<button class="btn ghost" onclick="startOrder()">🔁 다른 세트</button>
        <button class="btn" onclick="goHome()">🏠 홈으로</button>`:'');
  $('pool').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
    if(og.done) return;
    const p=og.pool.splice(+el.dataset.i,1)[0];
    const pos=og.picked.length;
    if(p.i===pos) og.first.add(pos); else fxNO();
    og.picked.push(p);
    if(og.picked.length===og.items.length){
      og.done=true;
      const n=og.first.size, tot=og.items.length, pct=Math.round(n/tot*100);
      if(n===tot) fxOK();
      let rk=null; if(window.Rank){ try{ rk=Rank.award(pct,{mode:'🧩 동작 순서 맞추기'}); }catch(e){} }
      renderOrder();
      $('oexp').innerHTML=`<div class="exp"><b>${n} / ${tot} 자리 정답 (${pct}점)</b><br>
        정답 순서 — ${og.items.map((x,i)=>`${i+1}. ${x.label}`).join(' → ')}<br>
        <span class="muted">문제 표기: ${set.act}</span></div>
        ${rk?`<div class="card" style="margin-top:11px">${Rank.resultBox(rk)}</div>`:''}`;
      if(rk&&rk.tierUp&&window.FX)FX.banner({icon:rk.tierAfter.icon,title:`${rk.tierAfter.name} 승급!`,sub:`${rk.after} RP`,stars:3,btn:'좋아',onClose:()=>{}});
      else if(n===tot&&window.FX)FX.banner({icon:'🧩',title:'순서 완성!',sub:`${set.n}세트 테스트 동작`,stars:3,btn:'확인',onClose:()=>{}});
    } else renderOrder();
  });
}

let cbt=null;
function startCbt(){
  const qs=shuffle(BANK).slice(0,20).map(q=>{const ans=q.o[q.a],o=shuffle(q.o);return{...q,o,a:o.indexOf(ans)};});
  cbt={qs,i:0,ok:0,wrong:[]}; renderCbt();
}
function renderCbt(){
  if(cbt.i>=cbt.qs.length){
    const sc=Math.round(cbt.ok/cbt.qs.length*100);
    if(!best.cbt||sc>best.cbt){best.cbt=sc;store.set('best',best);}
    return gameResult('✅ 실기 점검', cbt.ok, cbt.qs.length, cbt.wrong, startCbt, sc);
  }
  const it=cbt.qs[cbt.i];
  $('sc').innerHTML=`
  <div class="card">
    <div style="display:flex"><div class="pill">✅ 실기 점검 ${cbt.i+1} / ${cbt.qs.length}</div>
      <div class="score" style="flex:1">맞은 개수 ${cbt.ok}</div></div>
    <div class="qtext" style="margin-top:12px">${it.q}</div>
    <div id="opts">${it.o.map((v,i)=>`<button class="opt" data-i="${i}">${i+1}. ${v}</button>`).join('')}</div>
    <div id="exp"></div>
  </div>`;
  foot('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const pick=+b.dataset.i, ok=pick===it.a;
    $('opts').querySelectorAll('.opt').forEach((x,i)=>{x.onclick=null;
      if(i===it.a)x.classList.add('ok'); else if(i===pick)x.classList.add('no'); else x.classList.add('dim');});
    if(ok){cbt.ok++;fxOK();}else{cbt.wrong.push(it.q.replace(/<[^>]+>/g,'')+` → ${it.o[it.a]}`);fxNO();}
    $('exp').innerHTML=`<div class="exp"><b>${ok?'정답':'정답은 '+(it.a+1)+'번'}</b> · ${it.e}</div>`;
    foot(`<button class="btn" id="nx">${cbt.i===cbt.qs.length-1?'결과 보기':'다음 →'}</button>`);
    $('nx').onclick=()=>{cbt.i++;renderCbt();};
  });
}

/* ═══════ 결과 화면 ═══════ */
/* 생기부 — 같은 활동을 몇 번째 도전하는지 세어 둔다(제출 payload 의 retry) */
function bumpTry(m){
  var d={}; try{ d=JSON.parse(localStorage.getItem('try_semiconSilgi'))||{}; }catch(e){}
  d[m]=(d[m]||0)+1;
  try{ localStorage.setItem('try_semiconSilgi', JSON.stringify(d)); }catch(e){}
  return d[m];
}
function gameResult(title, ok, tot, wrong, retry, score){
  const sc = score!==undefined?score:Math.round(ok/tot*100);
  // 계급 정산
  let rk=null;
  if(window.Rank){ try{ rk=Rank.award(sc,{mode:title}); }catch(e){} }
  $('sc').innerHTML=`
  <div class="card" style="text-align:center">
    <div class="pill">${title}</div>
    <div style="font-size:44px;font-weight:900;margin:12px 0 2px;color:${sc>=60?'var(--good)':'var(--bad)'}">${sc}점</div>
    <div class="sub">${tot}문항 중 <b class="hi">${ok}개</b> 정답${score!==undefined?` · ${sc>=60?'합격선 통과':'합격선 60점 미달'}`:''}</div>
    ${best.cbt&&score!==undefined?`<div class="muted">최고 기록 ${best.cbt}점</div>`:''}
  </div>
  ${rk?`<div class="card">${Rank.resultBox(rk)}</div>`:''}
  ${wrong.length?`<div class="card"><div class="pill">틀린 문제</div>
    <ul style="font-size:13.5px">${wrong.map(w=>`<li>${w}</li>`).join('')}</ul></div>`
   :`<div class="card"><b class="hi">틀린 문제가 하나도 없습니다.</b></div>`}
  <div id="rcbox"></div>`;
  // 결과 제출 버튼 — ?rc=<교사 Apps Script exec> 로 열었을 때만 보입니다
  const hasRC=(window.ResultCollector&&ResultCollector.config&&ResultCollector.config.endpoint)||/[?&]rc=/.test(location.search);
  if(hasRC){
    $('rcbox').innerHTML=`<button class="btn" id="rcGo" style="width:100%;background:linear-gradient(180deg,#3ad995,#22a873)">📨 선생님께 결과 제출</button>`;
    $('rcGo').onclick=()=>{
      if(!window.ResultCollector) return;
      ResultCollector.open({score:sc, correct:ok, total:tot,
        /* 생기부 — 활동명·도전횟수·계급 */
        mode:'반도체설비보전 실기 — '+title,
        retry:bumpTry(title),
        tier: window.Rank ? Rank.get().tier.full : undefined,
        wrong:wrong.map((_,i)=>i+1), durationSec:0,
        detail:title+(rk?` · ${rk.tierAfter.full} ${rk.after}RP`:'')});
    };
  }
  foot(`<button class="btn ghost" id="rr">🔁 다시</button><button class="btn" onclick="goHome()">🏠 홈으로</button>`);
  $('rr').onclick=retry;
  // 승급 연출
  if(rk&&rk.tierUp&&window.FX&&FX.banner)
    FX.banner({icon:rk.tierAfter.icon,title:`${rk.tierAfter.name} 승급!`,
      sub:`${rk.after} RP · ${title}`,stars:3,btn:'좋아',onClose:()=>{}});
  else if(rk&&rk.promoted&&window.FX&&FX.burst) FX.burst({type:'ok'});
}

    </table></div>`:''}

    <div class="rowbtn"><button class="btn ghost" id="rkReset">↺ 계급 초기화</button></div>
